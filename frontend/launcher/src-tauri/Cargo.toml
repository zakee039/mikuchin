[package]
name = "mikuchin"
version = "0.2.8"
description = "Mikuchin desktop manager with PolyStrata inference"
authors = ["PolyStrata contributors"]
edition = "2021"

[lib]
name = "mikuchin_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
winreg = "0.52"
tauri-plugin-dialog = "2"
