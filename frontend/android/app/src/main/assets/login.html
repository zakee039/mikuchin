<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<title>Mikuchin</title>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #39C5BB;
    --accent-soft: rgba(57, 197, 187, 0.12);
    --danger: #dc2626;
    --ok: #10b981;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  .gate {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100dvh;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 20px calc(18px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  .spacer {
    flex: 1 1 0%;
    min-height: 12px;
  }
  .card {
    flex: 0 0 auto;
    width: min(100%, 390px);
    margin: 0 auto;
    padding: 20px 18px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: var(--surface);
    box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .mode-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 3px;
    border-radius: 10px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .mode-tab {
    height: 34px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-tab.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
  }
  .ts-box {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
  }
  .ts-box.visible {
    display: flex;
  }
  .ts-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 13px;
  }
  .ts-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    color: var(--ink);
  }
  .ts-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    background: var(--muted);
  }
  .ts-dot.running { background: var(--ok); }
  .ts-dot.wait { background: var(--warn); }
  .ts-dot.err { background: var(--danger); }
  .ts-meta {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
    word-break: break-all;
  }
  .ts-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .btn-secondary {
    height: 34px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-secondary.accent {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  .btn-secondary:disabled {
    opacity: 0.55;
  }
  .mikuchin-fields {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .mikuchin-fields.hidden {
    display: none;
  }
  .row {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr);
    align-items: center;
    gap: 10px;
  }
  .label {
    font-size: 14px;
    font-weight: 700;
    text-align: right;
    user-select: none;
  }
  .input {
    width: 100%;
    min-width: 0;
    height: 42px;
    padding: 0 12px;
    font-size: 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    outline: none;
  }
  .input:focus {
    border-color: var(--accent);
    background: var(--surface);
  }
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 40px;
    padding-top: 2px;
  }
  .error {
    flex: 1;
    font-size: 12.5px;
    color: var(--danger);
    line-height: 1.35;
  }
  .submit {
    flex: 0 0 auto;
    min-width: 90px;
    height: 40px;
    padding: 0 18px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .submit:disabled {
    opacity: 0.55;
  }
  [hidden] { display: none !important; }
  .card { width: min(100%, 430px); padding: 19px; box-shadow: none; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon { display: grid; place-items: center; width: 42px; height: 42px;
    flex: none; background: var(--accent-soft); border-radius: 13px; color: #189e97;
    font-size: 25px; font-weight: 800; }
  .brand strong { font-size: 18px; letter-spacing: -.3px; }
  .brand p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .entry-chooser, .entry-editor { display: flex; flex-direction: column; gap: 13px; }
  .network-summary { display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--surface-2); font-size: 12px; color: var(--muted); }
  .network-summary strong { color: var(--ink); font-weight: 700; text-align: right; overflow-wrap: anywhere; }
  .auto-row { display: flex; justify-content: space-between; align-items: center;
    gap: 12px; font-size: 13px; padding: 1px 3px; }
  .auto-row strong { display: block; font-size: 13px; }
  .auto-row small { display: block; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .auto-row input { width: 19px; height: 19px; accent-color: var(--accent); }
  .entry-list { display: flex; flex-direction: column; gap: 9px; }
  .entry-card { display: flex; align-items: center; gap: 5px; border-radius: 12px;
    border: 1px solid var(--line); min-height: 70px; background: #fff; overflow: hidden; }
  .entry-card.preferred { border-color: #39c5bb9e; background: #f6fffd; }
  .entry-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0;
    padding: 13px 6px 13px 12px; border: 0; background: transparent; color: inherit;
    text-align: left; cursor: pointer; }
  .entry-symbol { display: grid; place-items: center; flex: 0 0 35px; height: 35px;
    background: var(--surface-2); border-radius: 10px; color: #299b96; font-size: 19px; }
  .entry-copy { flex: 1; min-width: 0; }
  .entry-copy strong { display: block; font-size: 13px; margin-bottom: 4px; }
  .entry-copy small { display: block; color: var(--muted); font-size: 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-copy em { display: block; margin-top: 5px; font-size: 10.5px;
    color: #16867e; font-style: normal; }
  .entry-edit { border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 19px 12px; }
  .empty-entries { font-size: 12px; color: var(--muted); text-align: center;
    padding: 26px 14px; border: 1px dashed var(--line); border-radius: 11px; }
  .chooser-actions { display: flex; gap: 9px; }
  .chooser-actions button { flex: 1; height: 39px; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .add-entry { background: var(--accent); color: white; border: 1px solid var(--accent); }
  .retry-entry { background: white; color: var(--ink); border: 1px solid var(--line); }
  .chooser-status { min-height: 16px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .chooser-status.error { color: var(--danger); }
  .editor-head { display: flex; justify-content: space-between; align-items: center;
    gap: 10px; font-size: 15px; font-weight: 750; }
  .editor-head button { border: 0; background: transparent; color: var(--muted);
    font-size: 12px; padding: 8px 0; cursor: pointer; }
  .wifi-memory { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; }
  .wifi-memory span { flex: 1; color: var(--muted); min-width: 130px; overflow-wrap: anywhere; }
  .editor-footer { display: flex; gap: 8px; flex-wrap: wrap; }
  .editor-footer button { flex: 1; }
  .editor-footer .danger { color: var(--danger); }
</style>
</head>
<body>
<section class="gate">
  <div class="spacer"></div>
  <form class="card" id="login-form" autocomplete="off">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">M</div>
      <div><strong>Mikuchin</strong><p>连接到你的桌面助手</p></div>
    </header>
    <div class="entry-chooser" id="entry-chooser">
      <div class="network-summary"><span>当前网络</span><strong id="network-name">检测中…</strong></div>
      <label class="auto-row" for="auto-connect">
        <span><strong>智能自动连接</strong><small>优先使用 Wi-Fi 记忆，失败时尝试已保存入口</small></span>
        <input id="auto-connect" type="checkbox" checked>
      </label>
      <div class="entry-list" id="entry-list" role="group" aria-label="已保存的连接入口"></div>
      <div class="chooser-actions">
        <button class="add-entry" type="button" id="add-entry">＋ 添加入口</button>
        <button class="retry-entry" type="button" id="retry-entry">自动重试</button>
      </div>
      <div class="chooser-status" id="chooser-status" role="status" aria-live="polite"></div>
    </div>
    <div class="entry-editor" id="entry-editor" hidden>
    <div class="editor-head"><span id="editor-title">新建连接入口</span><button type="button" id="editor-back">返回入口列表</button></div>
    <label for="entry-name" class="row"><span class="label">名称</span>
      <input class="input" id="entry-name" type="text" maxlength="45" autocomplete="off" placeholder="例如：桌面热点"></label>
    <div class="mode-tabs" role="tablist">
      <button type="button" class="mode-tab active" id="tab-direct" data-mode="direct">直接连接</button>
      <button type="button" class="mode-tab" id="tab-tailscale" data-mode="tailscale">Tailscale</button>
    </div>

    <div class="ts-box" id="ts-box">
      <div class="ts-head">
        <span class="ts-status">
          <span class="ts-dot" id="ts-dot"></span>
          <span id="ts-state-text">等待授权</span>
        </span>
        <span class="ts-meta" id="ts-ip-text">mikuchin-android</span>
      </div>
      <div class="ts-meta" id="ts-hint">请先点击下方按钮跳转网页完成 Tailscale 授权登录</div>
      <div class="ts-actions">
        <button type="button" class="btn-secondary accent" id="ts-login-btn">Tailscale 网页授权登录</button>
        <button type="button" class="btn-secondary" id="ts-auth-btn" style="display:none">打开授权网页</button>
        <button type="button" class="btn-secondary" id="ts-reconnect-btn" style="display:none">重连</button>
        <button type="button" class="btn-secondary" id="ts-logout-btn" style="display:none">退出</button>
      </div>
    </div>

    <div class="mikuchin-fields" id="mikuchin-fields">
      <label class="row" for="endpoint">
        <span class="label">接口</span>
        <input class="input" id="endpoint" type="text" inputmode="url" autocapitalize="none" spellcheck="false" autocomplete="off">
      </label>
      <label class="row" for="key">
        <span class="label">key</span>
        <input class="input" id="key" type="password" autocomplete="off" placeholder="该入口的 API Key">
      </label>
      <button type="button" class="btn-secondary" id="reuse-key" hidden>使用当前已保存的 Key</button>
      <div class="actions">
        <span class="error" id="error" role="alert"></span>
        <button type="submit" class="submit" id="submit">保存并连接</button>
      </div>
    </div>
    <div class="wifi-memory" id="wifi-memory" hidden>
      <span id="wifi-memory-text">尚未绑定 Wi-Fi</span>
      <button type="button" class="btn-secondary" id="wifi-bind">绑定当前 Wi-Fi</button>
      <button type="button" class="btn-secondary" id="wifi-clear" hidden>取消记忆</button>
    </div>
    <div class="editor-footer">
      <button type="button" class="btn-secondary" id="save-only">仅保存</button>
      <button type="button" class="btn-secondary danger" id="delete-entry" hidden>删除入口</button>
    </div>
    </div>
  </form>
  <div class="spacer"></div>
</section>
<script>
  const form = document.getElementById("login-form");
  const tabDirect = document.getElementById("tab-direct");
  const tabTailscale = document.getElementById("tab-tailscale");
  const tsBox = document.getElementById("ts-box");
  const mikuchinFields = document.getElementById("mikuchin-fields");
  const tsDot = document.getElementById("ts-dot");
  const tsStateText = document.getElementById("ts-state-text");
  const tsIpText = document.getElementById("ts-ip-text");
  const tsHint = document.getElementById("ts-hint");
  const tsLoginBtn = document.getElementById("ts-login-btn");
  const tsAuthBtn = document.getElementById("ts-auth-btn");
  const tsReconnectBtn = document.getElementById("ts-reconnect-btn");
  const tsLogoutBtn = document.getElementById("ts-logout-btn");
  const endpointEl = document.getElementById("endpoint");
  const keyEl = document.getElementById("key");
  const errorEl = document.getElementById("error");
  const submitEl = document.getElementById("submit");

  let currentMode = "direct";
  let lastAuthUrl = "";
  let tsRunning = false;

  function syncFieldsVisibility() {
    // A Tailscale entry should be editable/savable even before first login.
    mikuchinFields.classList.remove("hidden");
  }

  function applyMode(mode, notifyBridge = true) {
    currentMode = mode === "tailscale" ? "tailscale" : "direct";
    tabDirect.classList.toggle("active", currentMode === "direct");
    tabTailscale.classList.toggle("active", currentMode === "tailscale");
    tsBox.classList.toggle("visible", currentMode === "tailscale");
    errorEl.textContent = "";
    if (notifyBridge && window.MikuchinAndroid && window.MikuchinAndroid.setConnectionMode) {
      window.MikuchinAndroid.setConnectionMode(currentMode);
    }
    if (window.MikuchinAndroid && window.MikuchinAndroid.getSavedEndpoint) {
      endpointEl.value = window.MikuchinAndroid.getSavedEndpoint() || "";
    }
    syncFieldsVisibility();
    refreshTailscaleStatus();
  }

  function renderTailscaleStatus(raw) {
    if (!raw) return;
    let st = raw;
    if (typeof raw === "string") {
      try { st = JSON.parse(raw); } catch { return; }
    }
    const state = st.state || "Stopped";
    lastAuthUrl = st.authUrl || "";
    tsRunning = state === "Running";
    syncFieldsVisibility();

    tsDot.className = "ts-dot";
    if (state === "Running") {
      tsDot.classList.add("running");
      tsStateText.textContent = "已授权连接";
      tsIpText.textContent = (st.hostname || "mikuchin-android") + (st.tailscaleIp ? " · " + st.tailscaleIp : "");
      tsHint.textContent = "Tailnet 已就绪，请在下方输入接口与 key 连接 Mikuchin";
      tsLoginBtn.style.display = "none";
      tsAuthBtn.style.display = "none";
      tsReconnectBtn.style.display = "inline-block";
      tsLogoutBtn.style.display = "inline-block";
    } else if (state === "NeedsLogin" || lastAuthUrl) {
      tsDot.classList.add("wait");
      tsStateText.textContent = "等待网页授权";
      tsIpText.textContent = st.hostname || "mikuchin-android";
      tsHint.textContent = "请点击下方按钮打开 Tailscale 网页完成登录与设备授权";
      tsLoginBtn.style.display = "inline-block";
      tsAuthBtn.style.display = lastAuthUrl ? "inline-block" : "none";
      tsReconnectBtn.style.display = "none";
      tsLogoutBtn.style.display = "none";
    } else if (state === "Starting") {
      tsDot.classList.add("wait");
      tsStateText.textContent = "正在初始化...";
      tsIpText.textContent = st.hostname || "mikuchin-android";
      tsHint.textContent = "正在准备 Tailscale 节点并获取网页授权链接...";
      tsLoginBtn.style.display = "inline-block";
      tsAuthBtn.style.display = "none";
      tsReconnectBtn.style.display = "none";
      tsLogoutBtn.style.display = "none";
    } else if (state === "Error") {
      tsDot.classList.add("err");
      tsStateText.textContent = "连接异常";
      tsIpText.textContent = st.hostname || "mikuchin-android";
      tsHint.textContent = st.error || "Tailscale 节点初始化失败，请重试";
      tsLoginBtn.style.display = "inline-block";
      tsAuthBtn.style.display = "none";
      tsReconnectBtn.style.display = "inline-block";
      tsLogoutBtn.style.display = "none";
    } else {
      tsStateText.textContent = "未授权";
      tsIpText.textContent = st.hostname || "mikuchin-android";
      tsHint.textContent = "请先点击下方按钮跳转网页完成 Tailscale 授权登录";
      tsLoginBtn.style.display = "inline-block";
      tsAuthBtn.style.display = "none";
      tsReconnectBtn.style.display = "none";
      tsLogoutBtn.style.display = "none";
    }
  }

  function refreshTailscaleStatus() {
    if (document.getElementById("entry-editor").hidden || currentMode !== "tailscale" ||
        !window.MikuchinAndroid || !window.MikuchinAndroid.getTailscaleStatus) return;
    renderTailscaleStatus(window.MikuchinAndroid.getTailscaleStatus());
  }

  tabDirect.onclick = () => applyMode("direct");
  tabTailscale.onclick = () => applyMode("tailscale");

  tsLoginBtn.onclick = () => {
    errorEl.textContent = "";
    if (lastAuthUrl && window.MikuchinAndroid && window.MikuchinAndroid.openAuthUrl) {
      window.MikuchinAndroid.openAuthUrl(lastAuthUrl);
      return;
    }
    tsStateText.textContent = "正在获取授权网页...";
    tsHint.textContent = "获取成功后将自动跳转浏览器完成 Tailscale 授权登录...";
    if (window.MikuchinAndroid && window.MikuchinAndroid.startTailscaleLogin) {
      renderTailscaleStatus(window.MikuchinAndroid.startTailscaleLogin());
    }
  };

  tsAuthBtn.onclick = () => {
    if (lastAuthUrl && window.MikuchinAndroid && window.MikuchinAndroid.openAuthUrl) {
      window.MikuchinAndroid.openAuthUrl(lastAuthUrl);
    }
  };

  tsReconnectBtn.onclick = () => {
    errorEl.textContent = "";
    if (window.MikuchinAndroid && window.MikuchinAndroid.reconnectTailscale) {
      renderTailscaleStatus(window.MikuchinAndroid.reconnectTailscale());
    }
  };

  tsLogoutBtn.onclick = () => {
    errorEl.textContent = "";
    if (window.MikuchinAndroid && window.MikuchinAndroid.logoutTailscale) {
      renderTailscaleStatus(window.MikuchinAndroid.logoutTailscale());
    }
  };

  window.onTailscaleStatus = (statusJson) => {
    renderTailscaleStatus(statusJson);
  };

  if (window.MikuchinAndroid) {
    endpointEl.value = window.MikuchinAndroid.getSavedEndpoint() || "";
    keyEl.value = window.MikuchinAndroid.getSavedKey() || "";
    const savedMode = window.MikuchinAndroid.getConnectionMode ? window.MikuchinAndroid.getConnectionMode() : "direct";
    applyMode(savedMode, false);
  }

  setInterval(refreshTailscaleStatus, 1500);

  const chooser = document.getElementById("entry-chooser");
  const editor = document.getElementById("entry-editor");
  const entryList = document.getElementById("entry-list");
  const entryName = document.getElementById("entry-name");
  const autoToggle = document.getElementById("auto-connect");
  const chooserStatus = document.getElementById("chooser-status");
  const wifiMemory = document.getElementById("wifi-memory");
  const wifiMemoryText = document.getElementById("wifi-memory-text");
  const wifiClear = document.getElementById("wifi-clear");
  const bridge = window.MikuchinAndroid || null;
  let snapshot = {entries:[],preferredId:"",currentSsid:"",autoEnabled:true};
  let editingId = "";
  let autoTimer = null;

  function status(message, failed = false) {
    chooserStatus.textContent = message;
    chooserStatus.classList.toggle("error", failed);
  }
  function stopAuto() {
    if (autoTimer != null) { clearTimeout(autoTimer); autoTimer = null; }
    bridge?.cancelAutoConnect?.();
  }
  function loadSnapshot(next) {
    if (typeof next === "string") {
      try { next = JSON.parse(next); } catch { next = {}; }
    }
    snapshot = next && typeof next === "object" ? next : snapshot;
    const wifi = snapshot.currentSsid;
    document.getElementById("network-name").textContent = wifi || "SSID 不可用 / 未授权";
    autoToggle.checked = snapshot.autoEnabled !== false;
    renderEntries();
  }
  function renderEntries() {
    entryList.replaceChildren();
    const list = Array.isArray(snapshot.entries) ? snapshot.entries : [];
    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty-entries";
      empty.textContent = "尚无连接入口。点击下方按钮保存桌面地址。";
      entryList.append(empty);
    }
    const selectedWifi = snapshot.currentSsid;
    const ordered = [...list].sort((a,b) => {
      const rank = p => p.wifiSsid && p.wifiSsid === selectedWifi ? 0 :
        p.id === snapshot.preferredId ? 1 : 2;
      return rank(a) - rank(b);
    });
    for (const item of ordered) {
      const card = document.createElement("div");
      card.className = "entry-card" + (item.id === snapshot.preferredId ? " preferred" : "");
      const main = document.createElement("button");
      main.type = "button";
      main.className = "entry-main";
      main.setAttribute("aria-label", "连接 " + item.name);
      const symbol = document.createElement("span");
      symbol.className = "entry-symbol";
      symbol.textContent = item.mode === "tailscale" ? "◇" :
        item.endpoint.startsWith("https://") ? "◎" : "⌁";
      const copy = document.createElement("span");
      copy.className = "entry-copy";
      const name = document.createElement("strong");
      name.textContent = item.name;
      const address = document.createElement("small");
      address.textContent = item.endpoint;
      copy.append(name,address);
      if (item.wifiSsid) {
        const label = document.createElement("em");
        label.textContent = item.wifiSsid === selectedWifi ? "当前 Wi-Fi · 优先入口" :
          "记忆网络：" + item.wifiSsid;
        copy.append(label);
      }
      main.append(symbol,copy);
      main.onclick = () => {
        stopAuto();
        status("正在连接 " + item.name + "…");
        bridge?.connectProfile?.(item.id);
      };
      const change = document.createElement("button");
      change.type = "button";
      change.className = "entry-edit";
      change.textContent = "编辑";
      change.setAttribute("aria-label", "编辑 " + item.name);
      change.onclick = () => openEditor(item);
      card.append(main,change);
      entryList.append(card);
    }
  }

  function updateWifiControls() {
    const found = (snapshot.entries || []).find(p => p.id === editingId);
    wifiMemory.hidden = !found;
    wifiMemoryText.textContent = found?.wifiSsid ? "已记住：" + found.wifiSsid :
      "尚未记住 Wi-Fi，可选绑定";
    wifiClear.hidden = !found?.wifiSsid;
  }
  function openEditor(item = null) {
    stopAuto();
    chooser.hidden = true;
    editor.hidden = false;
    editingId = item?.id || "";
    document.getElementById("editor-title").textContent = item ? "编辑连接入口" : "添加连接入口";
    entryName.value = item?.name || "";
    applyMode(item?.mode || "direct");
    endpointEl.value = item?.endpoint || "";
    keyEl.value = item ? (bridge?.getProfileKey?.(item.id) || "") : "";
    document.getElementById("reuse-key").hidden = !!item;
    document.getElementById("delete-entry").hidden = !editingId;
    errorEl.textContent = "";
    submitEl.disabled = false;
    updateWifiControls();
  }
  function showChooser() {
    editor.hidden = true;
    chooser.hidden = false;
    loadSnapshot(bridge?.getConnectionProfiles?.());
  }
  function saveEditor(connect) {
    if (!bridge?.saveConnectionProfile) return;
    const result = JSON.parse(bridge.saveConnectionProfile(editingId, entryName.value,
      currentMode, endpointEl.value.trim(), keyEl.value.trim()));
    if (!result.ok) { errorEl.textContent = result.error || "保存失败"; return; }
    editingId = result.id;
    loadSnapshot(result.profiles);
    if (connect) {
      showChooser();
      status("正在连接 " + entryName.value.trim() + "…");
      bridge.connectProfile(result.id);
    } else {
      showChooser();
      status("入口已保存，可以点击连接或绑定 Wi-Fi 记忆");
    }
  }

  document.getElementById("add-entry").onclick = () => openEditor();
  document.getElementById("reuse-key").onclick = () => {
    keyEl.value = bridge?.getSavedKey?.() || "";
    errorEl.textContent = keyEl.value ? "已填入此前连接的 Key，仅用于你接下来保存的入口" :
      "此前没有可复用的 Key";
  };
  document.getElementById("editor-back").onclick = showChooser;
  document.getElementById("save-only").onclick = () => saveEditor(false);
  let confirmDeleteId = "";
  document.getElementById("delete-entry").onclick = () => {
    if (!editingId) return;
    if (confirmDeleteId !== editingId) {
      confirmDeleteId = editingId;
      errorEl.textContent = "再次点击「删除入口」将永久移除此入口和它的 Wi-Fi 记忆";
      return;
    }
    loadSnapshot(bridge.deleteConnectionProfile(editingId));
    confirmDeleteId = "";
    showChooser();
  };
  document.getElementById("wifi-bind").onclick = () => {
    if (!editingId) return;
    bridge?.bindCurrentWifi?.(editingId);
  };
  wifiClear.onclick = () => {
    if (!editingId) return;
    loadSnapshot(bridge.clearWifiMemory(editingId));
    updateWifiControls();
  };
  autoToggle.onchange = () => {
    bridge?.setConnectionAutoEnabled?.(autoToggle.checked);
    if (!autoToggle.checked) {stopAuto();status("已关闭自动连接，入口仍可手动选择");}
  };
  function startAutomatic(force = false) {
    stopAuto();
    if (!(snapshot.entries || []).length) {status("请先添加至少一个入口",true);return;}
    status("正在按网络记忆检测已保存入口…");
    if (force) bridge?.retryAutoConnect?.();
    else bridge?.startAutoConnect?.();
  }
  document.getElementById("retry-entry").onclick = () => startAutomatic(true);

  window.onEntryProgress = (_id,message) => status(message);
  window.onWifiMemoryResult = (ok,message,next) => {
    loadSnapshot(next);
    updateWifiControls();
    if (editor.hidden) status(message,!ok); else errorEl.textContent = message;
  };
  window.onConnectResult = (ok,message) => {
    submitEl.disabled = false;
    if (!ok) {
      status(message || "入口连接失败",true);
      if (!editor.hidden) errorEl.textContent = message || "连接失败";
    }
  };
  form.onsubmit = e => {e.preventDefault();saveEditor(true);};

  if (bridge?.getConnectionProfiles) {
    loadSnapshot(bridge.getConnectionProfiles());
    if (!location.search.includes("manual=1") && snapshot.autoEnabled !== false &&
        snapshot.entries?.length) {
      status("即将自动连接 · 点按或滑动可暂停自动连接");
      autoTimer = setTimeout(() => {
        autoTimer = null;
        startAutomatic();
      }, 4000);
    }
  }
  // Reading/editing the chooser is an intentional decision: never auto-open
  // the chat page while the user is scrolling through their saved entries.
  document.addEventListener("pointerdown", () => {
    if (autoTimer !== null) {
      stopAuto();
      status("已暂停自动连接，点击入口即可手动连接");
    }
  }, {passive:true});
</script>
</body>
</html>
