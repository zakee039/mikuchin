[package]
name = "polystrata-manager"
version = "0.1.12"
description = "PolyStrata Windows tray manager"
authors = ["PolyStrata contributors"]
edition = "2021"

[lib]
name = "polystrata_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
winreg = "0.52"
tauri-plugin-dialog = "2"
